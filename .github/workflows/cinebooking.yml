# CI для фулстек-демо CineBooking (fullstackProject/).
#
# Герметичные уровни без внешних зависимостей:
#   web          — eslint (границы FSD) + typecheck (vue-tsc) + vitest + production-сборка
#   api          — jest юнит + интеграционные (фейковые Postgres/RabbitMQ/Redis на Map) + сборка
#   worker       — go test
#   notification — go test (гексагональный сервис уведомлений)
#   recommendation — go test (КиноСоветник: gRPC-рекомендации)
#   reminder     — go test (напоминания о сеансах)
#   pricing      — go test (Тарификатор: динамические цены)
#   ratelimiter  — go test (Привратник: лимиты частоты)
#
# E2E против живого docker-стенда в CI не гоняем: он требует поднятия
# всего compose-окружения и остаётся локальным (`npm run test:e2e`
# корректно пропускается, если стенд не поднят).
#
# Репо — портфолио на GitHub Pages, где меняется не только fullstackProject,
# поэтому стоят path-фильтры: гоняемся только по своему каталогу.
name: cinebooking

on:
  push:
    branches: [main]
    paths: ['fullstackProject/**', '.github/workflows/cinebooking.yml']
  pull_request:
    paths: ['fullstackProject/**', '.github/workflows/cinebooking.yml']
  workflow_dispatch:

concurrency:
  group: cinebooking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — vitest + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fullstackProject/apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fullstackProject/apps/web/package-lock.json

      - run: npm ci

      # границы слоёв FSD: импорт только из нижележащих слоёв и своего среза
      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  api:
    name: api — jest (unit + integration) + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fullstackProject/apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fullstackProject/apps/api/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run test:integration

      # dist нужен docker-образу: проверяем, что проект компилируется
      - run: npm run build

  worker:
    name: worker — go test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fullstackProject/services/ticket-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: fullstackProject/services/ticket-worker/go.mod
          cache-dependency-path: fullstackProject/services/ticket-worker/go.sum

      - run: go test ./...

  notification:
    name: notification — go test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fullstackProject/services/notification-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: fullstackProject/services/notification-service/go.mod
          cache-dependency-path: fullstackProject/services/notification-service/go.sum

      - run: go test ./...

  recommendation:
    name: recommendation — go test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fullstackProject/services/recommendation-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: fullstackProject/services/recommendation-service/go.mod
          cache-dependency-path: fullstackProject/services/recommendation-service/go.sum

      - run: go test ./...

  reminder:
    name: reminder — go test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fullstackProject/services/reminder-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: fullstackProject/services/reminder-service/go.mod
          cache-dependency-path: fullstackProject/services/reminder-service/go.sum

      - run: go test ./...

  pricing:
    name: pricing — go test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fullstackProject/services/pricing-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: fullstackProject/services/pricing-service/go.mod
          cache-dependency-path: fullstackProject/services/pricing-service/go.sum

      - run: go test ./...

  ratelimiter:
    name: ratelimiter — go test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fullstackProject/services/ratelimiter-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: fullstackProject/services/ratelimiter-service/go.mod
          cache-dependency-path: fullstackProject/services/ratelimiter-service/go.sum

      - run: go test ./...
