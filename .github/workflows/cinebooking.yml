# CI для фулстек-демо CineBooking (fullstackProject/).
#
# Герметичные уровни без внешних зависимостей:
#   web          — eslint (границы FSD) + typecheck (vue-tsc) + vitest с coverage-порогом + сборка
#   web-ui       — Playwright против демо-режима (build:demo-test + vite
#                 preview, без бэкенда): витрина, полный цикл брони,
#                 waitlist-аншлаг, живая карта — та страница, что на Pages
#   api          — jest юнит с coverage-порогом + интеграционные (фейковые Postgres/RabbitMQ/Redis на Map) + сборка
#   api-containers — live-int: то же приложение целиком против одноразовых
#                 PG+RabbitMQ+Redis (testcontainers, TESTCONTAINERS=1):
#                 миграции, uq-констрейнты, настоящий брокер и кэш.
#                 Живой прогон делает робот, локально спеки скипаются —
#                 как у Go-сервисов
#   go           — matrix по шести Go-сервисам: build + vet + lint + test -race
#                 с порогом покрытия per-service
#                 (ticket-worker, notification, recommendation, reminder,
#                  pricing, ratelimiter); live-PG адаптеры пяти сервисов —
#                 против одноразовых Postgres (testcontainers, TESTCONTAINERS=1):
#                 живой прогон делает робот, локально тесты честно скипаются
#   proto        — buf lint (STANDARD) + buf breaking (дрейф gRPC-контрактов)
#   infra        — docker compose config + парсинг JSON/YAML в observability/
#   e2e          — живой стенд целиком (docker compose up --build --wait:
#                 PG+Redis+Rabbit+api+воркер+пять Go-сервисов) и test:e2e
#                 против него: HTTP → брокер → вердикты воркера → gRPC.
#                 Локально тот же прогон — `docker compose up` руками
#
# Репо — портфолио на GitHub Pages, где меняется не только fullstackProject,
# поэтому стоят path-фильтры: гоняемся только по своему каталогу.
name: cinebooking

on:
  push:
    branches: [main]
    paths: ['fullstackProject/**', '.github/workflows/cinebooking.yml']
  pull_request:
    paths: ['fullstackProject/**', '.github/workflows/cinebooking.yml']
  workflow_dispatch:

concurrency:
  group: cinebooking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — vitest + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fullstackProject/apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fullstackProject/apps/web/package-lock.json

      - run: npm ci

      # границы слоёв FSD: импорт только из нижележащих слоёв и своего среза
      - run: npm run lint

      - run: npm run typecheck

      # юниты с покрытием: пороги в vitest.config.ts ниже текущего
      # (89/79/84/90) — падать нельзя
      - run: npm run test:cov

      - run: npm run build

  # Браузерные UI-тесты (16): Playwright против демо-режима. Сборка
  # build:demo-test детерминирует вероятности витрины (вердикты всегда
  # успешны, «зрителей» живой карты водит тест через window.__cineDemo),
  # webServer конфига поднимает vite preview :4173 без бэкенда — проба
  # /api/health честно падает, приложение уходит в демо, как на Pages.
  web-ui:
    name: web — playwright (демо-режим)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fullstackProject/apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fullstackProject/apps/web/package-lock.json

      - run: npm ci

      # chromium один (полный зоопарк не нужен — темы и мобильная ширина
      # в самих спеках); кэш между прогонами, версия в ключе из лока
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('fullstackProject/apps/web/package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # соберёт демо-сборку и прогонит спеки; webServer поднимет сам
      - run: npm run test:ui

      # трейсы и снапшоты упавших спек — со страницы прогона
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: fullstackProject/apps/web/test-results/
          retention-days: 7

  api:
    name: api — jest (unit + integration) + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fullstackProject/apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fullstackProject/apps/api/package-lock.json

      - run: npm ci

      # юниты с покрытием: coverageThreshold в package.json ниже текущего
      # (statements 64 / branches 73 / functions 69 / lines 64) — падать нельзя
      - run: npm run test:cov

      - run: npm run test:integration

      # dist нужен docker-образу: проверяем, что проект компилируется
      - run: npm run build

  # Live-int уровень API (15-B): приложение целиком — миграции, сиды,
  # топология RabbitMQ — против одноразовых postgres:16-alpine /
  # redis:7-alpine / rabbitmq:3.13-alpine (образы как в compose стенда).
  # TESTCONTAINERS=1 — тот же гейт, что у Go-сервисов: локально спеки
  # скипаются (см. live-harness.ts), живой прогон делает CI-робот.
  # --runInBand зашит в скрипте: одна тройка контейнеров на все
  # спек-файлы (singleton в globalThis).
  api-containers:
    name: api — live-int (testcontainers PG+Rabbit+Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fullstackProject/apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fullstackProject/apps/api/package-lock.json

      - run: npm ci

      # Docker на раннере предустановлен; Ryuk подчищает контейнеры
      # по завершении джобы. Первый прогон тянет три образа (~40с),
      # дальше контейнеры стартуют за секунды
      - run: npm run test:live-int
        env:
          TESTCONTAINERS: 1

  # Шесть Go-сервисов одной матрицей: каждый элемент — отдельный раннер,
  # как раньше отдельные джобы, но без копипасты шагов. fail-fast: false —
  # упавший сервис не отменяет проверки остальных.
  # Шаги повторяют локальный ритуал перед коммитом: build + vet + test -race.
  go:
    name: ${{ matrix.name }} — go build + vet + test -race
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # TESTCONTAINERS=1: пяти сервисам с live-PG адаптерами даёт зелёный
    # свет testcontainers — каждый пакет postgres поднимает одноразовый
    # postgres:16-alpine (см. TestMain в repository_test.go); worker
    # переменную не использует. Локально её не ставим — live-тесты
    # скипаются, машина разработчика контейнеры не трогает.
    env:
      TESTCONTAINERS: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          # threshold: фиксация текущего покрытия с запасом ~1% вниз —
          # расти можно, падать нет (main/cmd и pb-генерат без тестов тянут
          # цифру вниз); пороги 51/39/39/43/43 подняты 30.09 по факту
          # live-PG прогона адаптеров на testcontainers (52.2/40.2/39.7/
          # 44.2/44.1), worker без БД — прежние 19/20.0
          - name: worker
            dir: ticket-worker
            threshold: 19
          - name: notification
            dir: notification-service
            threshold: 51
          - name: recommendation
            dir: recommendation-service
            threshold: 39
          - name: reminder
            dir: reminder-service
            threshold: 39
          - name: pricing
            dir: pricing-service
            threshold: 43
          - name: ratelimiter
            dir: ratelimiter-service
            threshold: 43
    defaults:
      run:
        working-directory: fullstackProject/services/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: fullstackProject/services/${{ matrix.dir }}/go.mod
          cache-dependency-path: fullstackProject/services/${{ matrix.dir }}/go.sum

      - run: go build ./...

      - run: go vet ./...

      # статический анализ шире go vet: errcheck/staticcheck/unused/ineffassign;
      # конфиг общий на все сервисы (fullstackProject/.golangci.yml, набор standard)
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0  # как локально — замечания не расходятся с машиной;
          # v2.14 первый, собранный с go1.26 — модули с директивой 1.26
          # (otel v1.47) линтуются только с него
          working-directory: fullstackProject/services/${{ matrix.dir }}
          args: --config=../../.golangci.yml

      # -race: воркер на атомиках и планировщики особенно благодарны
      # детектору; заодно пишем общий профиль покрытия всех пакетов.
      # -count=1 обязателен: testcache может подсунуть результат прогона
      # без TESTCONTAINERS (скипы) вместо живого — проверено 30.09,
      # смена значения env-переменной не всегда инвалидирует кэш; в CI
      # прогоны и так должны быть свежими
      # -v: в CI логируем подробно — видны причины скипов live-тестов
      # (t.Skipf молчит без verbose) и ход testcontainers-прогона
      - run: go test -race -count=1 -v -coverprofile=cover.out ./...

      # порог в matrix.threshold: ниже — красный шаг, расти можно
      - name: coverage threshold
        run: |
          total=$(go tool cover -func=cover.out | tail -1 | awk '{gsub(/%/, ""); print $3}')
          echo "покрытие: ${total}% (порог ${{ matrix.threshold }}%)"
          awk -v t="$total" -v min="${{ matrix.threshold }}" 'BEGIN { exit t < min }' \
            || { echo "покрытие ${total}% ниже порога ${{ matrix.threshold }}%"; exit 1; }

  # Живой e2e-стенд (15-C): поднимаем compose-окружение ЦЕЛИКОМ — как его
  # поднимает разработчик локально, но на раннере CI. В прогон берём
  # событийный контур стенда: инфраструктура + api + Go-воркер + пять
  # Go-сервисов; web/prometheus/grafana e2e не нужны (UI — уровень
  # Playwright-демо). Сборка честная: docker compose build по тем же
  # Dockerfile, что летят на стенд. --wait держит до готовности api
  # (healthcheck в compose), затем test:e2e из apps/api — спеки ходят
  # на localhost:13000 (дефолт E2E_BASE_URL = маппинг стенда).
  e2e:
    name: e2e — живой compose-стенд + test:e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fullstackProject/apps/api/package-lock.json

      - run: npm ci
        working-directory: fullstackProject/apps/api

      # --build: образы api/воркера/Go-сервисов собираются из Dockerfile'ов
      # стенда; --wait: пока api не пройдёт healthcheck (миграции + брокер),
      # --wait-timeout: страховка от вечного ожидания
      - name: docker compose up --wait
        run: |
          docker compose up --build --wait --wait-timeout 300 -d \
            postgres redis rabbitmq \
            worker notification recommendation reminder pricing ratelimiter api
        working-directory: fullstackProject

      # страховка на случай, если --wait пропустил (healthcheck-флейк):
      # явная проба /api/health с понятным сообщением об ошибке
      - name: wait for /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:13000/api/health >/dev/null 2>&1; then
              echo "api готов (проба $i)"; exit 0
            fi
            sleep 5
          done
          echo "api не ожил за 300с — логи ниже"; docker compose logs --tail 100 api
          exit 1
        working-directory: fullstackProject

      - run: npm run test:e2e
        working-directory: fullstackProject/apps/api

      # посмертные логи стенда: на упавшей спеке видно, что делали сервисы
      - name: compose logs (только при падении)
        if: failure()
        run: docker compose logs --tail 300 api worker notification recommendation reminder pricing ratelimiter
        working-directory: fullstackProject

  # Контракты gRPC. lint — STANDARD с зафиксированными в proto/buf.yaml
  # исключениями (плоская раскладка, имена без «Service»). breaking —
  # дрейф против main до пуша: удалить поле или сменить тип не даст,
  # клиенты (NestJS API и Go-сервисы) собраны под старый контракт.
  # Ветки с правкой контракта проходят через pull_request — против базы.
  proto:
    name: proto — buf lint + breaking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: fullstackProject/proto
    steps:
      # full history: breaking читает коммит до пуша из git-ссылки
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.73.0  # как локально, генерат и проверки не расходятся

      - run: buf lint

      # push: против коммита до пуша; pull_request: против origin/main;
      # ручной запуск — без breaking (before не определён)
      - name: buf breaking
        if: github.event_name != 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            against="../../.git#branch=origin/main,subdir=fullstackProject/proto"
          else
            against="../../.git#ref=${{ github.event.before }},subdir=fullstackProject/proto"
          fi
          buf breaking --against "$against"

  # Инфра-конфиги стенда: то, что раньше проверяли руками перед каждым
  # коммитом («compose config валиден», «все JSON пропарсены»), теперь
  # делает CI. Ничего не поднимается — только валидация синтаксиса.
  infra:
    name: infra — compose config + observability JSON/YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # compose обязан собираться в валидный конфиг (переменные имеют дефолты,
      # .env не нужен); контейнеры не запускаются
      - name: docker compose config
        run: docker compose --file fullstackProject/docker-compose.yml config --quiet

      # дашборды Grafana (*.json) и конфиги Prometheus/provisioning (*.yml):
      # ошибки синтаксиса ловим до деплоя стенда
      - name: parse observability JSON/YAML
        run: |
          python3 - <<'EOF'
          import glob, json, sys
          import yaml

          bad = []
          json_files = sorted(glob.glob("fullstackProject/observability/**/*.json", recursive=True))
          for path in json_files:
              try:
                  with open(path, encoding="utf-8") as fh:
                      json.load(fh)
              except ValueError as err:
                  bad.append(f"{path}: {err}")

          yaml_files = sorted(glob.glob("fullstackProject/observability/**/*.yml", recursive=True))
          for path in yaml_files:
              try:
                  with open(path, encoding="utf-8") as fh:
                      yaml.safe_load(fh)
              except yaml.YAMLError as err:
                  bad.append(f"{path}: {err}")

          print(f"parsed {len(json_files)} JSON, {len(yaml_files)} YAML")
          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          EOF
