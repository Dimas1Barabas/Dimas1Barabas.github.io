# CI для фулстек-демо CineBooking (fullstackProject/).
#
# Герметичные уровни без внешних зависимостей:
#   web          — eslint (границы FSD) + typecheck (vue-tsc) + vitest с coverage-порогом + сборка
#   api          — jest юнит с coverage-порогом + интеграционные (фейковые Postgres/RabbitMQ/Redis на Map) + сборка
#   go           — matrix по шести Go-сервисам: build + vet + lint + test -race
#                 с порогом покрытия per-service
#                 (ticket-worker, notification, recommendation, reminder,
#                  pricing, ratelimiter); live-PG адаптеры пяти сервисов —
#                 против одноразовых Postgres (testcontainers, TESTCONTAINERS=1):
#                 живой прогон делает робот, локально тесты честно скипаются
#   proto        — buf lint (STANDARD) + buf breaking (дрейф gRPC-контрактов)
#   infra        — docker compose config + парсинг JSON/YAML в observability/
#
# E2E против живого docker-стенда в CI не гоняем: он требует поднятия
# всего compose-окружения и остаётся локальным (`npm run test:e2e`
# корректно пропускается, если стенд не поднят).
#
# Репо — портфолио на GitHub Pages, где меняется не только fullstackProject,
# поэтому стоят path-фильтры: гоняемся только по своему каталогу.
name: cinebooking

on:
  push:
    branches: [main]
    paths: ['fullstackProject/**', '.github/workflows/cinebooking.yml']
  pull_request:
    paths: ['fullstackProject/**', '.github/workflows/cinebooking.yml']
  workflow_dispatch:

concurrency:
  group: cinebooking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — vitest + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fullstackProject/apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fullstackProject/apps/web/package-lock.json

      - run: npm ci

      # границы слоёв FSD: импорт только из нижележащих слоёв и своего среза
      - run: npm run lint

      - run: npm run typecheck

      # юниты с покрытием: пороги в vitest.config.ts ниже текущего
      # (89/79/84/90) — падать нельзя
      - run: npm run test:cov

      - run: npm run build

  api:
    name: api — jest (unit + integration) + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fullstackProject/apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fullstackProject/apps/api/package-lock.json

      - run: npm ci

      # юниты с покрытием: coverageThreshold в package.json ниже текущего
      # (statements 64 / branches 73 / functions 69 / lines 64) — падать нельзя
      - run: npm run test:cov

      - run: npm run test:integration

      # dist нужен docker-образу: проверяем, что проект компилируется
      - run: npm run build

  # Шесть Go-сервисов одной матрицей: каждый элемент — отдельный раннер,
  # как раньше отдельные джобы, но без копипасты шагов. fail-fast: false —
  # упавший сервис не отменяет проверки остальных.
  # Шаги повторяют локальный ритуал перед коммитом: build + vet + test -race.
  go:
    name: ${{ matrix.name }} — go build + vet + test -race
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # TESTCONTAINERS=1: пяти сервисам с live-PG адаптерами даёт зелёный
    # свет testcontainers — каждый пакет postgres поднимает одноразовый
    # postgres:16-alpine (см. TestMain в repository_test.go); worker
    # переменную не использует. Локально её не ставим — live-тесты
    # скипаются, машина разработчика контейнеры не трогает.
    env:
      TESTCONTAINERS: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          # threshold: фиксация текущего покрытия с запасом ~1% вниз —
          # расти можно, падать нет (main/cmd и pb-генерат без тестов тянут
          # цифру вниз); с включением testcontainers-прогона live-PG
          # адаптеров покрытие подрастёт — порог пересмотрим по факту
          - name: worker
            dir: ticket-worker
            threshold: 19
          - name: notification
            dir: notification-service
            threshold: 38
          - name: recommendation
            dir: recommendation-service
            threshold: 31
          - name: reminder
            dir: reminder-service
            threshold: 26
          - name: pricing
            dir: pricing-service
            threshold: 31
          - name: ratelimiter
            dir: ratelimiter-service
            threshold: 29
    defaults:
      run:
        working-directory: fullstackProject/services/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: fullstackProject/services/${{ matrix.dir }}/go.mod
          cache-dependency-path: fullstackProject/services/${{ matrix.dir }}/go.sum

      - run: go build ./...

      - run: go vet ./...

      # статический анализ шире go vet: errcheck/staticcheck/unused/ineffassign;
      # конфиг общий на все сервисы (fullstackProject/.golangci.yml, набор standard)
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0  # как локально — замечания не расходятся с машиной
          working-directory: fullstackProject/services/${{ matrix.dir }}
          args: --config=../../.golangci.yml

      # -race: воркер на атомиках и планировщики особенно благодарны
      # детектору; заодно пишем общий профиль покрытия всех пакетов.
      # -count=1 обязателен: testcache может подсунуть результат прогона
      # без TESTCONTAINERS (скипы) вместо живого — проверено 30.09,
      # смена значения env-переменной не всегда инвалидирует кэш; в CI
      # прогоны и так должны быть свежими
      - run: go test -race -count=1 -coverprofile=cover.out ./...

      # порог в matrix.threshold: ниже — красный шаг, расти можно
      - name: coverage threshold
        run: |
          total=$(go tool cover -func=cover.out | tail -1 | awk '{gsub(/%/, ""); print $3}')
          echo "покрытие: ${total}% (порог ${{ matrix.threshold }}%)"
          awk -v t="$total" -v min="${{ matrix.threshold }}" 'BEGIN { exit t < min }' \
            || { echo "покрытие ${total}% ниже порога ${{ matrix.threshold }}%"; exit 1; }

  # Контракты gRPC. lint — STANDARD с зафиксированными в proto/buf.yaml
  # исключениями (плоская раскладка, имена без «Service»). breaking —
  # дрейф против main до пуша: удалить поле или сменить тип не даст,
  # клиенты (NestJS API и Go-сервисы) собраны под старый контракт.
  # Ветки с правкой контракта проходят через pull_request — против базы.
  proto:
    name: proto — buf lint + breaking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: fullstackProject/proto
    steps:
      # full history: breaking читает коммит до пуша из git-ссылки
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.73.0  # как локально, генерат и проверки не расходятся

      - run: buf lint

      # push: против коммита до пуша; pull_request: против origin/main;
      # ручной запуск — без breaking (before не определён)
      - name: buf breaking
        if: github.event_name != 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            against="../../.git#branch=origin/main,subdir=fullstackProject/proto"
          else
            against="../../.git#ref=${{ github.event.before }},subdir=fullstackProject/proto"
          fi
          buf breaking --against "$against"

  # Инфра-конфиги стенда: то, что раньше проверяли руками перед каждым
  # коммитом («compose config валиден», «все JSON пропарсены»), теперь
  # делает CI. Ничего не поднимается — только валидация синтаксиса.
  infra:
    name: infra — compose config + observability JSON/YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # compose обязан собираться в валидный конфиг (переменные имеют дефолты,
      # .env не нужен); контейнеры не запускаются
      - name: docker compose config
        run: docker compose --file fullstackProject/docker-compose.yml config --quiet

      # дашборды Grafana (*.json) и конфиги Prometheus/provisioning (*.yml):
      # ошибки синтаксиса ловим до деплоя стенда
      - name: parse observability JSON/YAML
        run: |
          python3 - <<'EOF'
          import glob, json, sys
          import yaml

          bad = []
          json_files = sorted(glob.glob("fullstackProject/observability/**/*.json", recursive=True))
          for path in json_files:
              try:
                  with open(path, encoding="utf-8") as fh:
                      json.load(fh)
              except ValueError as err:
                  bad.append(f"{path}: {err}")

          yaml_files = sorted(glob.glob("fullstackProject/observability/**/*.yml", recursive=True))
          for path in yaml_files:
              try:
                  with open(path, encoding="utf-8") as fh:
                      yaml.safe_load(fh)
              except yaml.YAMLError as err:
                  bad.append(f"{path}: {err}")

          print(f"parsed {len(json_files)} JSON, {len(yaml_files)} YAML")
          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          EOF
