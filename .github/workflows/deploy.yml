name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Разрешаем публиковать сайт и подписывать деплой (нужно для deploy-pages).
permissions:
  contents: read
  pages: write
  id-token: write

# Только один деплой за раз; новый отменяет зависший старый —
# protects от того самого «deployment_queued», которым заклинивало.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # node_modules не должны попадать на сайт — удаляем всё, что есть.
      - name: Remove node_modules
        run: find . -type d -name node_modules -prune -exec rm -rf {} +

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
