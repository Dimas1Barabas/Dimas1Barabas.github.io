server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API проксируется на NestJS-контейнер (сервис api в docker compose)
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # SSE (/api/bookings/stream): без буферизации и с долгим таймаутом,
    # иначе nginx накопит ответ в буфер и события не дойдут до клиента
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_read_timeout 3600s;
  }

  # SPA: все остальные пути отдают index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
