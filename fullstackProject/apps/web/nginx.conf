server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # WebSocket живой карты мест (гейтвей /api/seats): апгрейд соединения.
  # Отдельный location до /api/ — «map» был бы только http-контекстом,
  # а этот файл монтируется как server-block (conf.d); путь WS-эксклюзивен,
  # REST карты живёт на /api/sessions/:id/seats — пересечения нет
  location /api/seats {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  # API проксируется на NestJS-контейнер (сервис api в docker compose)
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # SSE (/api/bookings/stream): без буферизации и с долгим таймаутом,
    # иначе nginx накопит ответ в буфер и события не дойдут до клиента
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_read_timeout 3600s;
  }

  # SPA: все остальные пути отдают index.html (и статику /assets —
  # этот же location). Security-заголовки только здесь: ответы /api/
  # идут мимо, у API свой Helmet — дубли X-Frame-Options ни к чему
  location / {
    try_files $uri $uri/ /index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    # Скрипты — только свои; единственный инлайн — скрипт темы из
    # index.html (гасит FOUC до первой отрисовки). Vite не переписывает
    # его при сборке, хэш стабилен между билдами. WS живой карты и
    # fetch API покрывает 'self' (CSP3 матчит ws/wss того же origin),
    # favicon и QR-SVG — data:-URI в img-src
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-MJIgjkCATXWwky7sUKXYjFZBRR/wPqeUcMYHoC6Tubo='; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  }
}
