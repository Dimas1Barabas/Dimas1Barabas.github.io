name: cine-booking

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cine
      POSTGRES_PASSWORD: cine
      POSTGRES_DB: cine
    # host-порты выбраны из «высоких», чтобы не конфликтовать
    # с локальными postgres/node-процессами на 5432/3000/8080
    ports:
      - '15432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cine -d cine']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672' # UI управления: guest/guest
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./apps/api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://cine:cine@postgres:5432/cine
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      # секрет подписи JWT; для продакшена задавать свой через env
      JWT_SECRET: ${JWT_SECRET:-dev-cine-secret}
      # секрет HMAC-подписи QR-билетов (смена секрета гасит все билеты)
      TICKETS_SECRET: ${TICKETS_SECRET:-dev-cine-tickets-secret}
      # окно оплаты брони (TTL wait-очереди RabbitMQ + expires_at).
      # Меняешь значение — пересоздай очередь: docker compose down
      # (у rabbitmq нет volume, но брокер между рестартами помнит args)
      PAYMENT_TIMEOUT_MS: '120000'
      # база одноразовой ссылки сброса пароля в «письме» (фронт стенда)
      RESET_LINK_BASE: http://localhost:18080/#/reset-password
      # кэшбэк бонусной программы: % от фактически оплаченной суммы
      # CONFIRMED-брони (дефолт в коде 5 — тут задан явно для наглядности)
      BONUS_CASHBACK_PERCENT: '5'
      # КиноСоветник: gRPC-адрес сервиса рекомендаций внутри сети compose
      # (соединение ленивое — API стартует и без него, блок просто скрывается)
      GRPC_RECOMMENDATION_URL: recommendation:8084
      # напоминания: gRPC-адрес reminder-сервиса (вызовы fire-and-forget,
      # недоступность не валит вердикты брони)
      GRPC_REMINDER_URL: reminder:8086
      # Тарификатор: gRPC-адрес цен (недоступность — базовая цена афиши)
      GRPC_PRICING_URL: pricing:8088
      # Привратник: gRPC-адрес лимитов (недоступность — fail-open,
      # запрос проходит без проверки)
      GRPC_RATELIMITER_URL: ratelimiter:8090
      # OpenTelemetry: OTLP/HTTP-эндпоинт Jaeger; без переменной
      # SDK не поднимается вовсе (CI-e2e без observability)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # Secure-флаг refresh-cookie (httpOnly + SameSite=Lax — всегда):
      # включать только когда стенд за TLS — по http браузер куку
      # с Secure не сохранит и вход развалится
      COOKIE_SECURE: 'false'
    ports:
      - '13000:3000'
    # readiness по факту, а не «процесс стартовал»: на первом boot'е api
    # гоняет миграции и ждёт брокера, /api/health оживает последним.
    # Нужен docker compose up --wait (e2e в CI и локальные прогоны)
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      recommendation:
        condition: service_started
      reminder:
        condition: service_started
      pricing:
        condition: service_started
      ratelimiter:
        condition: service_started

  worker:
    build: ./services/ticket-worker
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      HTTP_ADDR: :8081
      WORKER_ID: go-worker-1
      # OpenTelemetry: OTLP gRPC-эндпоинт Jaeger; без переменной — no-op
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - '8081:8081'
    depends_on:
      rabbitmq:
        condition: service_healthy

  # гексагональный Go-сервис: вердикты брони → клиентские уведомления;
  # host-порт 18082 (8080 на хосте занят)
  notification:
    build: ./services/notification-service
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      HTTP_ADDR: :8080
      # история уведомлений — в собственной БД cine_notifications того же
      # кластера; базу и схему сервис создаёт сам при старте
      # (initdb-скрипты на уже инициализированном volume не сработают)
      STORAGE: postgres
      DATABASE_URL: postgres://cine:cine@postgres:5432/cine_notifications
      # OpenTelemetry: OTLP gRPC-эндпоинт Jaeger; без переменной — no-op
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - '18082:8080'
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # гексагональный Go-сервис «КиноСоветник»: сигналы зрителей из RabbitMQ
  # (подтверждённые брони, отзывы) → персональный топ афиши по gRPC;
  # сигналы — в собственной БД cine_recommendations того же кластера
  recommendation:
    build: ./services/recommendation-service
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      GRPC_ADDR: :8084
      HTTP_ADDR: :8085
      STORAGE: postgres
      DATABASE_URL: postgres://cine:cine@postgres:5432/cine_recommendations
      # OpenTelemetry: OTLP gRPC-эндпоинт Jaeger; без переменной — no-op
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - '18084:8084' # gRPC Recommendations (API ходит внутри сети; хост-порт — для grpcurl)
      - '18085:8085' # /health и /profile?userId= — витрина профиля зрителя
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # гексагональный Go-сервис напоминаний: подтверждённая бронь →
  # gRPC Schedule (гасит Cancel при возврате), тикер в момент
  # «сеанс − окно» публикует user.session.reminder в обмен cinema;
  # очередь напоминаний — в собственной БД cine_reminders
  reminder:
    build: ./services/reminder-service
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      GRPC_ADDR: :8086
      HTTP_ADDR: :8087
      STORAGE: postgres
      DATABASE_URL: postgres://cine:cine@postgres:5432/cine_reminders
      # окно напоминания: прод-семантика «за 2 часа»; стенду нужны
      # минуты, чтобы письмо было видно руками и в e2e
      REMINDER_LEAD_MINUTES: '2'
      REMINDER_TICK_SECONDS: '5'
      # OpenTelemetry: OTLP gRPC-эндпоинт Jaeger; без переменной — no-op
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - '18086:8086' # gRPC Reminders (API ходит внутри сети; хост-порт — для grpcurl)
      - '18087:8087' # /health и /reminders — витрина очереди напоминаний
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # гексагональный Go-сервис «Тарификатор»: спрос на сеанс копит из
  # событий брони (booking.payment.wait / waitlist.seat.released),
  # цену места с факторами времени суток/выходного/заполненности
  # отдаёт по gRPC; проекция и история квотов — в собственной БД
  # cine_prices. TZ — «часы кинотеатра» для правил времени суток
  pricing:
    build: ./services/pricing-service
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      GRPC_ADDR: :8088
      HTTP_ADDR: :8089
      STORAGE: postgres
      DATABASE_URL: postgres://cine:cine@postgres:5432/cine_prices
      TZ: Europe/Moscow
      # OpenTelemetry: OTLP gRPC-эндпоинт Jaeger; без переменной — no-op
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - '18088:8088' # gRPC Pricing (API ходит внутри сети; хост-порт — для grpcurl)
      - '18089:8089' # /health, /prices, /demand — витрина квотов и спроса
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # гексагональный Go-сервис «Привратник»: лимиты частоты действий
  # (token bucket: бронь и вход) по gRPC Check; корзины — в собственной
  # БД cine_ratekeeper. Сервис чисто синхронный — брокер не нужен.
  # Лимит брони на стенде отпущен шире продуктового (30 вместо 10/мин):
  # e2e-сьют сам создаёт больше десяти броней в минуту одним ботовским
  # пользователем; честные 10/мин — дефолты сервиса и демо-движка Pages
  ratelimiter:
    build: ./services/ratelimiter-service
    environment:
      GRPC_ADDR: :8090
      HTTP_ADDR: :8091
      STORAGE: postgres
      DATABASE_URL: postgres://cine:cine@postgres:5432/cine_ratekeeper
      RATE_BOOKINGS_PER_MIN: '30'
      RATE_LOGIN_PER_MIN: '5'
      # OpenTelemetry: OTLP gRPC-эндпоинт Jaeger; без переменной — no-op
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - '18090:8090' # gRPC RateLimiter (API ходит внутри сети; хост-порт — для grpcurl)
      - '18091:8091' # /health, /buckets — витрина корзин
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - '18080:80'
    depends_on:
      - api
    # без restart-политики: контейнеры не поднимаются сами при старте Docker Desktop —
    # только по `docker compose up`

  # Prometheus — скрейпер метрик: опрашивает /metrics всех сервисов
  # и RabbitMQ (встроенный плагин, 15692) каждые 5с, историю держит
  # в собственной TSDB. Grafana рисует дашборды поверх него.
  # host-порт 19090 (9090 на хосте не занят, но держим конвенцию 1xxxx)
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '19090:9090'

  # Grafana — витрина метрик: датасорс и дашборды провиженятся из
  # observability/grafana при старте, ручных настроек в UI не нужно.
  # Анонимный Viewer — дашборды открываются без логина (демо);
  # admin-вход — для правок. host-порт 19000 (3000 занят API-стендом)
  grafana:
    image: grafana/grafana:11.5.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-cine}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '19000:3000'
    depends_on:
      - prometheus

  # Jaeger v2 — бэкенд трейсов: юниты пишут OTLP (API — http/4318, Go —
  # grpc/4317), UI на 16686. Образ собран на OTel-коллекторе: memory-хранилище
  # и приём OTLP включены дефолтами, конфиг-файл не нужен; трейсы живут до
  # рестарта контейнера (без volume) — демо-стенду достаточно. В CI-e2e не
  # поднимается: там у юнитов нет OTEL-переменной и трейсинг выключен гейтом
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - '16686:16686' # UI: поиск трейсов, карта сервисов, сравнение

  # Loki — хранилище логов: файловый TSDB в volume, retention неделя.
  # Приём push-логов от Alloy (3100), host-порт 19310 — конвенция 19xxx
  # observability-полосы. В CI-e2e не поднимается вместе с Alloy.
  loki:
    image: grafana/loki:3.7.8
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    ports:
      - '19310:3100'

  # Alloy — шиппер логов (наследник promtail): docker-дискавери всех
  # контейнеров проекта, JSON-строки юнитов парсятся пайплайном
  # (level → метка), сырые строки (nginx) проходят как есть. UI отладки
  # пайплайна — 19245. Читает только docker.sock, файлы не монтируем.
  alloy:
    image: grafana/alloy:v1.20.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - '19245:12345'
    depends_on:
      - loki

volumes:
  pgdata:
  lokidata:
