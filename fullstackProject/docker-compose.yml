name: cine-booking

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cine
      POSTGRES_PASSWORD: cine
      POSTGRES_DB: cine
    # host-порты выбраны из «высоких», чтобы не конфликтовать
    # с локальными postgres/node-процессами на 5432/3000/8080
    ports:
      - '15432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cine -d cine']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672' # UI управления: guest/guest
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./apps/api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://cine:cine@postgres:5432/cine
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      # секрет подписи JWT; для продакшена задавать свой через env
      JWT_SECRET: ${JWT_SECRET:-dev-cine-secret}
      # секрет HMAC-подписи QR-билетов (смена секрета гасит все билеты)
      TICKETS_SECRET: ${TICKETS_SECRET:-dev-cine-tickets-secret}
      # окно оплаты брони (TTL wait-очереди RabbitMQ + expires_at).
      # Меняешь значение — пересоздай очередь: docker compose down
      # (у rabbitmq нет volume, но брокер между рестартами помнит args)
      PAYMENT_TIMEOUT_MS: '120000'
      # база одноразовой ссылки сброса пароля в «письме» (фронт стенда)
      RESET_LINK_BASE: http://localhost:18080/#/reset-password
      # кэшбэк бонусной программы: % от фактически оплаченной суммы
      # CONFIRMED-брони (дефолт в коде 5 — тут задан явно для наглядности)
      BONUS_CASHBACK_PERCENT: '5'
      # КиноСоветник: gRPC-адрес сервиса рекомендаций внутри сети compose
      # (соединение ленивое — API стартует и без него, блок просто скрывается)
      GRPC_RECOMMENDATION_URL: recommendation:8084
    ports:
      - '13000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      recommendation:
        condition: service_started

  worker:
    build: ./services/ticket-worker
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      HTTP_ADDR: :8081
      WORKER_ID: go-worker-1
    ports:
      - '8081:8081'
    depends_on:
      rabbitmq:
        condition: service_healthy

  # гексагональный Go-сервис: вердикты брони → клиентские уведомления;
  # host-порт 18082 (8080 на хосте занят)
  notification:
    build: ./services/notification-service
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      HTTP_ADDR: :8080
      # история уведомлений — в собственной БД cine_notifications того же
      # кластера; базу и схему сервис создаёт сам при старте
      # (initdb-скрипты на уже инициализированном volume не сработают)
      STORAGE: postgres
      DATABASE_URL: postgres://cine:cine@postgres:5432/cine_notifications
    ports:
      - '18082:8080'
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # гексагональный Go-сервис «КиноСоветник»: сигналы зрителей из RabbitMQ
  # (подтверждённые брони, отзывы) → персональный топ афиши по gRPC;
  # сигналы — в собственной БД cine_recommendations того же кластера
  recommendation:
    build: ./services/recommendation-service
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      GRPC_ADDR: :8084
      HTTP_ADDR: :8085
      STORAGE: postgres
      DATABASE_URL: postgres://cine:cine@postgres:5432/cine_recommendations
    ports:
      - '18084:8084' # gRPC Recommendations (API ходит внутри сети; хост-порт — для grpcurl)
      - '18085:8085' # /health и /profile?userId= — витрина профиля зрителя
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - '18080:80'
    depends_on:
      - api
    # без restart-политики: контейнеры не поднимаются сами при старте Docker Desktop —
    # только по `docker compose up`

volumes:
  pgdata:
