name: cine-booking

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cine
      POSTGRES_PASSWORD: cine
      POSTGRES_DB: cine
    # host-порты выбраны из «высоких», чтобы не конфликтовать
    # с локальными postgres/node-процессами на 5432/3000/8080
    ports:
      - '15432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cine -d cine']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672' # UI управления: guest/guest
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./apps/api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://cine:cine@postgres:5432/cine
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - '13000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build: ./services/ticket-worker
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      HTTP_ADDR: :8081
      WORKER_ID: go-worker-1
    ports:
      - '8081:8081'
    depends_on:
      rabbitmq:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - '18080:80'
    depends_on:
      - api
    # без restart-политики: контейнеры не поднимаются сами при старте Docker Desktop —
    # только по `docker compose up`

volumes:
  pgdata:
