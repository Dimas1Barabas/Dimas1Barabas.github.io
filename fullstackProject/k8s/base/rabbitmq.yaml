# RabbitMQ — брокер событийного контура (брони → вердикты → уведомления).
# Без персистентности (как в compose-стенде): топологию объявляют сами
# сервисы при старте, CI-кластер каждый прогон поднимается с нуля.
# Management-UI (15672) наружу не выносим — она внутри кластера.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          # готовность = слушатель AMQP поднялся (потребителям нужен порт,
          # а не нода Erlang). rabbitmq-diagnostics из compose-healthcheck
          # в поде опрашивает распределённый Erlang-узел и в kind не
          # загорался — первый вид-джобы rollout wait висел на deploy/rabbitmq
          # полный таймаут; TCP-проба к 5672 эквивалентна по смыслу и без
          # зависимости от резолвинга имени ноды
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
