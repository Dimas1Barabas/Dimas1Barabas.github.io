# S3-хранилище постеров фильмов (этап 29): SeaweedFS в режиме server —
# мастер+филер+S3-шлюз одним процессом, зеркало compose-сервиса.
# Identity-конфиг (ключ cine, анонимам отказ) переезжает из
# seaweedfs/s3.json репозитория в ConfigMap и монтируется файлом.
# Данные постеров — PVC StatefulSet: стабильное имя пода, переживает
# пересоздание (как postgres).
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "cine-api",
          "credentials": [
            {
              "accessKey": "cine",
              "secretKey": "cine-poster-secret"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        },
        {
          "name": "anonymous",
          "actions": []
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  # имя = DNS-имя в кластере: seaweedfs:8333 — S3_ENDPOINT API;
  # 9333 — мастер для readiness-проб и initContainers-ожидателей
  name: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
    - name: master
      port: 9333
      targetPort: 9333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.53
          # args, не command: entrypoint.sh образа сам сузит права
          # (su-exec seaweed) и запустит weed с нашими аргументами.
          # -ip.bind=0.0.0.0 обязателен: пустой флаг означает «как -ip»,
          # а -ip — eth0-адрес пода, readiness-проба по localhost и
          # подключения через Service тогда ловят connection refused
          args:
            - server
            - -ip.bind=0.0.0.0
            - -dir=/data
            - -master.volumeSizeLimitMB=1024
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
          ports:
            - containerPort: 8333
            - containerPort: 9333
          # готовность мастера = raft-лидер выбран; /cluster/status в 4.x
          # нет (ловится catch-all /{fileId}), /healthz — безусловный
          # liveness, для старта зависимых сервисов нужен именно readyz.
          # wget внутри alpine-образа есть (busybox)
          readinessProbe:
            exec:
              command: ['sh', '-c', 'wget -qO- http://localhost:9333/readyz >/dev/null 2>&1']
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: s3config
              mountPath: /etc/seaweedfs/s3.json
              subPath: s3.json
              readOnly: true
            - name: seaweeddata
              mountPath: /data
      volumes:
        - name: s3config
          configMap:
            name: seaweedfs-s3-config
  volumeClaimTemplates:
    - metadata:
        name: seaweeddata
      spec:
        accessModes: ['ReadWriteOnce']
        # дефолтный класс kind (hostPath на ноде); в облаке подменится
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
