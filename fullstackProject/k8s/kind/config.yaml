# kind-кластер для CI (GitHub Actions): один control-plane-узел.
# extraPortMappings пробрасывает порты ноды-контейнера на хост раннера:
#   30100 → NodePort API (страховочная health-проба стенда мимо шлюза;
#           e2e ходит через Gateway — адрес даёт cloud-provider-kind
#           прямо на docker-сети kind, hostPort для него не нужен)
#   30101 → NodePort api-canary: прямые проверки канарейки e2e-спекой
#           (паритет версий), не смешивая трафик с весами маршрута
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30100
        hostPort: 30100
        protocol: TCP
      - containerPort: 30101
        hostPort: 30101
        protocol: TCP
