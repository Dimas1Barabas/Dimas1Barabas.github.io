# Loki — единое хранилище логов стенда (контейнеры собирает Alloy).
# Derived field: у строк с trace_id появляется кликабельный линк —
# трейс открывается в Jaeger (:16686) одной кнопкой, корреляция
# логов и трейсов работает в обе стороны.
apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"([0-9a-f]+)"'
          # стенд смотрит на хост: Jaeger UI на 16686
          url: 'http://localhost:16686/trace/${__value.raw}'
