# Конфиг кодогена buf для flags-сервиса; вызов в scripts/protogen.sh:
#   buf generate --template buf.gen.flags.yaml --path flags.proto
version: v2
plugins:
  - local: protoc-gen-go
    out: ../services/flags-service/internal/pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../services/flags-service/internal/pb
    opt: paths=source_relative
