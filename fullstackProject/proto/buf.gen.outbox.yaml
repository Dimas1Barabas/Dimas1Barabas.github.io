# Конфиг кодогена buf для outbox-relay; вызов в scripts/protogen.sh:
#   buf generate --template buf.gen.outbox.yaml --path outbox.proto
version: v2
plugins:
  - local: protoc-gen-go
    out: ../services/outbox-relay/internal/pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../services/outbox-relay/internal/pb
    opt: paths=source_relative
