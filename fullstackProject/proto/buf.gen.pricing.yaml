# Конфиг кодогена buf для pricing-сервиса; вызов в scripts/protogen.sh:
#   buf generate --template buf.gen.pricing.yaml --path pricing.proto
version: v2
plugins:
  - local: protoc-gen-go
    out: ../services/pricing-service/internal/pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../services/pricing-service/internal/pb
    opt: paths=source_relative
