# Конфиг кодогена buf для ratelimiter-сервиса; вызов в scripts/protogen.sh:
#   buf generate --template buf.gen.ratelimiter.yaml --path ratelimiter.proto
version: v2
plugins:
  - local: protoc-gen-go
    out: ../services/ratelimiter-service/internal/pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../services/ratelimiter-service/internal/pb
    opt: paths=source_relative
