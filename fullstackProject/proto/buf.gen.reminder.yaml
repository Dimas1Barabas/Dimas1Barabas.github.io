# Конфиг кодогена buf для reminder-сервиса; вызов в scripts/protogen.sh:
#   buf generate --template buf.gen.reminder.yaml --path reminder.proto
version: v2
plugins:
  - local: protoc-gen-go
    out: ../services/reminder-service/internal/pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../services/reminder-service/internal/pb
    opt: paths=source_relative
