# Конфиг кодогена buf: proto/*.proto -> Go-код сервиса.
# Запуск (ставит плагины в GOPATH/bin при отсутствии): scripts/protogen.sh
version: v2
plugins:
  - local: protoc-gen-go
    out: ../services/recommendation-service/internal/pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../services/recommendation-service/internal/pb
    opt: paths=source_relative
