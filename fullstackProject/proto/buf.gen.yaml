# Конфиг кодогена buf: proto/*.proto -> Go-код сервисов.
# Контракт сервиса → свой шаблон; вызовы со --path фильтром в scripts/protogen.sh.
# Запуск (ставит плагины в GOPATH/bin при отсутствии): scripts/protogen.sh
#
# Этот шаблон — КиноСоветник:
#   buf generate --template buf.gen.yaml --path recommendation.proto
version: v2
plugins:
  - local: protoc-gen-go
    out: ../services/recommendation-service/internal/pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../services/recommendation-service/internal/pb
    opt: paths=source_relative
